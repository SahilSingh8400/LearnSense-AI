<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>LearnSense AI Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header>
        <div>
          <div class="brand">LearnSense <span>AI</span></div>
          <p>Learning analytics for your LeetCode practice</p>
        </div>
        <button id="logout" class="ghost">Logout</button>
      </header>
      <main>
        <section class="hero">
          <div>
            <h1>Your learning report</h1>
            <p id="user">Loading account...</p>
          </div>
          <button id="refresh" class="primary">Refresh</button>
        </section>
        <section class="cards">
          <div class="card">
            <span>Solved problems</span><strong id="solved">0</strong>
          </div>
          <div class="card">
            <span>Successful attempts</span><strong id="correct">0</strong>
          </div>
          <div class="card">
            <span>Wrong attempts</span><strong id="wrong">0</strong>
          </div>
          <div class="card">
            <span>Accuracy</span><strong id="accuracy">0%</strong>
          </div>
        </section>
        <section class="panel">
          <div class="panel-head">
            <h2>Problem performance</h2>
            <span id="status"></span>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Problem</th>
                  <th>Correct</th>
                  <th>Wrong</th>
                  <th>Total</th>
                  <th>Accuracy</th>
                  <th>Last solved</th>
                </tr>
              </thead>
              <tbody id="problems"></tbody>
            </table>
          </div>
        </section>
        <section class="panel">
          <div class="panel-head">
            <h2>Accepted solution</h2>
            <span id="solutionMeta"></span>
          </div>
          <pre id="code">Select a problem above.</pre>
        </section>
      </main>
    </div>
    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
