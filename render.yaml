services:
  - type: web
    name: learnsense-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -c "from app import app, db; app.app_context().__enter__(); db.create_all()"
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: learnsense-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: "production"
      - key: JWT_ACCESS_MINUTES
        value: "1440"
      - key: JWT_REFRESH_DAYS
        value: "30"
      - key: DASHBOARD_URL
        sync: false
      - key: DASHBOARD_ORIGIN
        sync: false

  - type: web
    name: learnsense-dashboard
    runtime: static
    rootDir: dashboard
    buildCommand: echo "No build step required"
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY

databases:
  - name: learnsense-db
    databaseName: learnsense
    user: learnsense
